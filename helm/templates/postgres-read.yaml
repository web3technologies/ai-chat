apiVersion: v1
kind: Service
metadata:
  name: postgres-read
  labels:
    app: postgres-read
spec:
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
  selector:
    app: postgres-read
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-read
  labels:
    app: postgres-read
spec:
  serviceName: postgres-read
  replicas: 1
  selector:
    matchLabels:
      app: postgres-read
  template:
    metadata:
      labels:
        app: postgres-read
    spec:
      initContainers:
        - name: basebackup
          image: {{ .Values.postgres.image }}
          securityContext:
            runAsUser: 0
          command: ["sh", "/scripts/standby.sh"]
          env:
            - name: STANDBY_INIT_ONLY
              value: "1"
            - name: PRIMARY_HOST
              value: postgres
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: REPLICATOR_PASSWORD
              value: replicator
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: standby
              mountPath: /scripts
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          command: ["postgres", "-c", "hot_standby=on"]
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", {{ .Values.postgres.user | quote }}, "-d", {{ .Values.postgres.database | quote }}]
            periodSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: standby
          configMap:
            name: postgres-standby
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.postgresRead.storage }}

apiVersion: batch/v1
kind: Job
metadata:
  name: migrate-{{ .Release.Revision }}
  labels:
    app: migrate
spec:
  backoffLimit: 30
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          command: ["sh", "-c"]
          args:
            - |
              until pg_isready -h postgres -U "$POSTGRES_USER" -d "$POSTGRES_DB"; do
                echo "waiting for postgres"
                sleep 2
              done
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
      containers:
        - name: migrate
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          args: ["true"]
          env:
            - name: HOME
              value: /tmp
            - name: DATABASE_URL
              value: {{ include "ai-chat.directUrl" . | quote }}
            - name: SEED_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: SEED_PASSWORD

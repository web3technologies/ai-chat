apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app: backend
spec:
  ports:
    - port: 3000
      targetPort: http
  selector:
    app: backend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      initContainers:
        {{- include "ai-chat.waitForSchema" . | nindent 8 }}
        {{- include "ai-chat.waitForBouncer" . | nindent 8 }}
        {{- include "ai-chat.waitForReplica" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ .Values.image }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: HOME
              value: /tmp
            - name: SKIP_MIGRATE
              value: "1"
            - name: DATABASE_URL
              value: {{ include "ai-chat.databaseUrl" . | quote }}
            - name: DATABASE_READ_URL
              value: {{ include "ai-chat.readUrl" . | quote }}
            - name: KAFKA_BROKERS
              value: kafka:9092
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: OPENAI_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secretName }}
                  key: JWT_SECRET
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            failureThreshold: 12

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_chat
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - hot_standby=on
      - -c
      - hba_file=/etc/postgres/pg_hba.conf
    ports:
      - "5432:5432"
    volumes:
      - ai_chat_pg:/var/lib/postgresql/data
      - ./postgres/pg_hba.conf:/etc/postgres/pg_hba.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_chat"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  bouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ai:ai@db:5432/ai_chat
      POOL_MODE: transaction
      AUTH_TYPE: scram-sha-256
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 20
      ADMIN_USERS: ai
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "localhost", "-p", "5432"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.1
    hostname: kafka
    restart: unless-stopped
    ports:
      - "9094:9094"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:9094,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 4
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      bouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      postgres-read:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ai:ai@bouncer:5432/ai_chat
      DATABASE_READ_URL: postgresql://ai:ai@postgres-read:5432/ai_chat
      DIRECT_URL: postgresql://ai:ai@db:5432/ai_chat
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-password}
      KAFKA_BROKERS: kafka:9092
    ports:
      - "3000:3000"

  chat-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "src/backend/consumers/chat/run.ts"]
    depends_on:
      bouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://ai:ai@bouncer:5432/ai_chat
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KAFKA_BROKERS: kafka:9092

  memories-consumer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "src/backend/consumers/memories/run.ts"]
    depends_on:
      bouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://ai:ai@bouncer:5432/ai_chat
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KAFKA_BROKERS: kafka:9092

  realtime:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "src/backend/realtime/run.ts"]
    depends_on:
      redis:
        condition: service_healthy
      postgres-read:
        condition: service_healthy
    environment:
      DATABASE_READ_URL: postgresql://ai:ai@postgres-read:5432/ai_chat
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
    ports:
      - "3001:3001"

  relay:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "src/backend/relay/run.ts"]
    depends_on:
      bouncer:
        condition: service_healthy
      kafka:
        condition: service_healthy
      backend:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://ai:ai@bouncer:5432/ai_chat
      KAFKA_BROKERS: kafka:9092

  fanout:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    entrypoint: ["node", "--conditions=react-server", "--import", "tsx", "src/backend/consumers/fanout/run.ts"]
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      KAFKA_BROKERS: kafka:9092
      REDIS_URL: redis://redis:6379

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-read:
    image: postgres:17
    user: "0:0"
    restart: unless-stopped
    environment:
      PRIMARY_HOST: db
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_chat
      REPLICATOR_PASSWORD: replicator
      PGDATA: /var/lib/postgresql/data/pgdata
    entrypoint: ["sh", "/standby.sh"]
    volumes:
      - ai_chat_pg_read:/var/lib/postgresql/data
      - ./postgres/standby.sh:/standby.sh:ro
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_chat"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  ai_chat_pg:
  ai_chat_pg_read:

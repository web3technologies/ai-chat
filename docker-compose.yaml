services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai
      POSTGRES_PASSWORD: ai
      POSTGRES_DB: ai_chat
    ports:
      - "5432:5432"
    volumes:
      - ai_chat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ai -d ai_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ai:ai@db:5432/ai_chat
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      SEED_PASSWORD: ${SEED_PASSWORD:-password}
    ports:
      - "3000:3000"

volumes:
  ai_chat_pg:

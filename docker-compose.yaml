services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: moritz
      POSTGRES_PASSWORD: moritz
      POSTGRES_DB: moritz_chat
    ports:
      - "5432:5432"
    volumes:
      - moritz_chat_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moritz -d moritz_chat"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://moritz:moritz@db:5432/moritz_chat
      JWT_SECRET: dev-only-change-me
    ports:
      - "3000:3000"

volumes:
  moritz_chat_pg:
